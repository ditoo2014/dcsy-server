  enabled: true
  debugLog: true
  dealQueue: xc_battery_deal_msg
  tag: battery_ttdc
  cacheRefreshSeconds: 30
  revisionPollSeconds: 5
  fullCacheRefreshMinutes: 60
  # 服务启动时依赖暂不可用的重试间隔。
  initRetrySeconds: 5
  gatewayAutoCreateEnabled: true
  channelAutoCreateEnabled: true
  ai:
    # AI 评估为可选能力，默认关闭；地址通过 DEAL_BATTERY_AI_URL 注入。
    enabled: false
    url: ""
    timeout: 3s

