syntax = "proto3"; // 指定proto版本
package auth_grpc;     // 指定默认包名

// 指定golang包名
option go_package = "./auth_grpc";

// 定义grpc服务
service AuthService {
    // 同步登录信息 -> to采集云
    rpc SyncLoginToTolink (UserInfo) returns (SyncLoginResponse){}
    // 同步登录信息 -> to业务云
    rpc SyncLoginToBusiness (UserInfo) returns (SyncLoginResponse){}
    // 同步登录信息 -> to云组态
    rpc SyncLoginToDynalt (UserInfo) returns (SyncLoginResponse){}
}

// 用户信息 - 用户名为唯一ID, 为主键; 防止攻击, 只能内部使用, 且覆盖被同步平台的用户层级(超管信息-是/否); 
message UserInfo {
    int64 id = 1;
    string username = 2;
    string password = 3;
    string truename = 4;
    string phone = 5;
    string email = 6;
    int64 createTimestamp = 7;
    int64 totalLogin= 8;
    string token = 9;
    string loginIp = 10;
    string lastIp = 11;
    int64 isAdmin = 12;
    string clientId = 13;
    reserved 14; // 已移除的历史字段编号，保留编号避免协议字段被误复用
    int64 parentId = 15;
    string platName = 16;
    string platType = 17;
    int64 platId = 18;
    int64 baned = 19;
    repeated int64 corpIds = 20;
    string renter = 21;
    string dbName = 22;
}

/* 同步响应数据 */
message SyncLoginResponse {
    int64 code = 1;
    string message = 2;
}
