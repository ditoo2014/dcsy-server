# 登录短信接口配置，messageTemplate 中保留验证码占位符。
sms:
  login:
    # false：调用真实短信接口；true：使用模拟验证码，不调用外部短信接口。
    # 生产环境保持 false；临时联调时可手动修改为 true，完成后应立即恢复。
    simulate: false
    # 模拟模式下使用的固定六位验证码；仅在 simulate=true 时生效。
    simulateCode: "000000"
    url: https://security.sctower.cn/gapi/open-api/sms/sendmessage
    expireSeconds: 300
    intervalSeconds: 60
    timeoutSeconds: 20
    messageTemplate: 您的登录验证码为：%s，5分钟内有效，请勿泄露。

# 连续登录失败限制，时间单位均为分钟。
security:
  # 季度改密配置须与 business.yml、tolink.yml 保持一致；修改后重启服务。
  password:
    # true：每个自然季度强制改密；false：关闭季度限制。
    # 管理员创建或重置密码后的首次改密要求仍然保留。
    enabled: true
    # 每年 1月、4月、7月、10月的 1日零点进入新季度，不是修改后满90天。
    mode: calendar_quarter
    # 按北京时间判断；程序内置时区数据。本配置不使用环境变量覆盖。
    timezone: Asia/Shanghai
  login:
    maxFailures: 5
    failureWindowMinutes: 15
    lockMinutes: 15


