
#user  root;
#worker_processes  auto;

#error_log  /var/log/nginx/error.log warn;
#pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # 1. 信任 Caddy 传递的 IP
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Real-IP;           # 使用 Caddy 设置的 X-Real-IP
    log_format proxy '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'real_ip:$realip_remote_addr '
                     'forwarded_for:"$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log proxy;
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    #server{
        gzip on;
        gzip_static on;
        gzip_min_length 1k;
        gzip_buffers 4 16k;
        gzip_comp_level 9;
        gzip_types text/plain application/javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
        gzip_vary on;
        gzip_disable "MSIE [1-6]\.";
#	}	

    server {
        listen       83;
        server_name  0.0.0.0 tmb.tuxiao.tolinkyun.com;
        # 前端静态资源配置
        location / {
	    root   /usr/share/nginx/html/cjy;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            index  index.html;
            try_files $uri $uri/ /index.html;
        }
	location ~ ^/largescreen/.*{
		root /usr/share/nginx/html/;
		index index.html;
		try_files $uri $uri/ /largescreen/index.html;
	}
	location ~ ^/go/auth/.* {
                proxy_pass http://localhost:9001;
        }
        location ~ ^/go/gateway/.* {
                proxy_pass http://localhost:9001;
        }
        location ~ ^/go/screen/.* {
                proxy_pass http://localhost:9001;
        }
        location ~ ^/go/stream/.* {
                proxy_pass http://localhost:9001;
        }
        location ~ ^/go/api/.* {
                proxy_pass http://localhost:9002;
        }
	location ~ ^/go/statistics/.* {
                proxy_pass http://localhost:8010;
        }
	location ~ ^/go/stats/.* {
                proxy_pass http://localhost:8013;
        }
	location ~ ^/go/count/.* {
                proxy_pass http://localhost:8011;
        }
	location ~ ^/go/lua/.* {
                proxy_pass http://localhost:8011;
        }
	location ~ ^/go/video/.* {
                proxy_pass http://localhost:8012;
        }
	location ~ ^/go/stats/.* {
                proxy_pass http://localhost:8020;
        }
        location ~ ^/go/download/.* {
                proxy_pass http://localhost:9004;
        }
	 location ~ ^/go/pushstream/.* {
                proxy_pass http://localhost:9005;
        }

	location ~ ^/api/pushapi/.* {
                proxy_pass http://localhost:9005;
        }

	location ~ ^/eazydb/.* {
        proxy_pass http://localhost:21001;
        }
        # 设置错误页面
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

	}
server {
        listen       8001;
        server_name  0.0.0.0 tmb.tuxiao.tolinkyun.com;

	root   /usr/share/nginx/html/dynalt3;
	index  index.html;
        # 前端静态资源配置
        location / {
            try_files $uri $uri/ /index.html;
        }
	location /go {
		proxy_pass http://localhost:9010;
