battery:
  # 订阅 TTDC 电池命名空间，再由下方白名单筛选锂硫和钠电主题。
  enabled: true
  debugLog: true
  subscribeFilter: "/DCBMS4G/+/PUB/+"
  # allowlist：只转发 candidateTopicSegments 中明确列出的电池类型。
  candidateRoutingMode: allowlist
  candidateTopicSegments:
    - SodiumBattery
    - LithiumSulfurBattery
  # 仅在使用 exclusive_namespace 模式且确认整个命名空间都属于电池设备时改为 true。
  candidateNamespaceExclusiveConfirmed: false
  dealQueue: xc_battery_deal_msg
  tag: battery_ttdc

log:
  filePath: ./logs/mqtt.log
